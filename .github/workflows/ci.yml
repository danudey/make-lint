name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --locked --all-features --all-targets
      - name: Doc tests
        run: cargo test --locked --all-features --doc

  # The differential suite compares the evaluator against whatever GNU Make is
  # on PATH, and distros ship 4.2.1 (RHEL 8) through 4.4.1 (Debian 13, Arch).
  # Only that suite runs here, from one statically linked binary reused across
  # containers, so covering a distro costs a pull rather than a second build.
  make-compat:
    name: make compat
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          key: musl-differential
      - name: Build the differential tests as a static binary
        run: |
          cargo test --locked --all-features --test differential --no-run \
            --target x86_64-unknown-linux-musl --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact"
                            and .target.name == "differential") | .executable' \
            | tail -1 > test-binary-path
          install -D "$(cat test-binary-path)" dist/differential
      - name: Run them against each distro's make
        run: .github/scripts/make-compat.sh dist/differential

  codequality:
    name: Run clippy analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install required cargo
        run: cargo install clippy-sarif sarif-fmt

      - uses: Swatinem/rust-cache@v2
      - run:
          cargo clippy
            --all-targets --all-features --locked
            --message-format=json | clippy-sarif | tee rust-clippy-results.sarif | sarif-fmt
        continue-on-error: true
      - name: Upload analysis results to GitHub
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: rust-clippy-results.sarif
          wait-for-processing: true
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Docs
        run: cargo doc --locked --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  # Catches cross-compilation breakage before it turns up mid-release.
  cross-build:
    name: cross-build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - riscv64gc-unknown-linux-musl
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo zigbuild --locked --release --target ${{ matrix.target }}
